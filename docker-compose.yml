services:
  llama-factory:
    image: hiyouga/llamafactory:latest
    container_name: llama-factory
    network_mode: host
    environment:
      - PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
      # Hugging Face mirror to speed up/avoid blocked downloads
      - HF_ENDPOINT=https://hf-mirror.com
      # Reuse host caches to avoid re-downloading models
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_CACHE=/root/.cache/huggingface
      - MODELSCOPE_CACHE=/root/.cache/modelscope
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    
    volumes:
      # 数据集挂载
      - ./data:/app/data
      # 输出模型挂载
      #- ./output:/app/output
      # checkpoint挂载
      - ./saves:/app/saves
      # 预加载模型挂载
      - ./models:/app/models
      # 复用宿主机缓存，避免重复下载
      - /data/.cache/hf:/root/.cache/huggingface
      - /data/.cache/modelscope:/root/.cache/modelscope
    
    shm_size: 16gb
    
    # 如果系统支持，使用 deploy.resources.reservations.devices 来声明 GPU 需求
    # 注意：某些旧的 docker-compose 版本对此不兼容；推荐使用 `docker compose` 插件
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # If you need GPU access, prefer using the newer "docker compose" plugin or a newer
    # docker-compose that supports device requests. The legacy compose file versions
    # may not support GPU device reservations. Remove or replace the block above
    # with an appropriate device request if your environment supports it.
    
    command: llamafactory-cli webui
    
    # 自动重启
    restart: unless-stopped
